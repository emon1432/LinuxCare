<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d24" />
      <stop offset="100%" stop-color="#141a45" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#273270" stroke-width="2" />

  <!-- Outer Glow Shield -->
  <path d="M64 22 L96 34 V66 C96 86 64 104 64 104 C64 104 32 86 32 66 V34 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="5" 
        filter="url(#glow)" 
        stroke-linejoin="round" />

  <!-- Inner Pulse Wave -->
  <path d="M44 64 L54 64 L59 52 L69 76 L74 64 L84 64" 
        fill="none" 
        stroke="#00f5d4" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
</svg>
